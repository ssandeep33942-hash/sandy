<header><div class="brand"><b class="lg2">₹</b><h1>Smart<span>Spend</span></h1></div><div class="row"><span class="av" id="av"></span><span id="who" class="k"></span><select id="ms" aria-label="Month" onchange="M=this.value;render()"></select><button class="g" onclick="exportCsv()">Export CSV</button><button class="g" onclick="logout()">Log out</button></div></header>

<script>
let K='';const S0=()=>({tx:[],rules:{},bud:{},rec:[],roll:false,acc:[],alarms:[],bills:[],ia:'',bw:{}});let S=S0();

const $=i=>document.getElementById(i),pad=n=>String(n).padStart(2,'0');
const CATS={Food:'#e07a3f',Transport:'#3b82c4',Rent:'#7c5cbf',Bills:'#c9a227',Shopping:'#d1568a',Health:'#2f9e6f',Entertainment:'#8a63d2',Savings:'#0f766e',Other:'#8b968f'};
const KW={Food:['swiggy','zomato','restaurant','cafe','dominos','bigbasket','zepto','blinkit','kitchen','bakery'],Transport:['uber','ola','rapido','metro','petrol','irctc','fuel','redbus','fastag'],Rent:['rent','landlord'],Bills:['jio','airtel','vodafone','electricity','bescom','broadband','water','gas','recharge'],Shopping:['amazon','flipkart','myntra','ajio','meesho','mall'],Health:['apollo','pharmacy','hospital','practo','clinic','medplus'],Entertainment:['netflix','spotify','hotstar','bookmyshow','prime','youtube'],Savings:['sip','mutual','zerodha','groww','ppf','deposit']};
const fmt=n=>(n<0?'-':'')+'₹'+Math.abs(Math.round(n)).toLocaleString('en-IN');

const now=new Date(),TODAY=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`,CUR=TODAY.slice(0,7);

const T=['Overview','Transactions','Accounts','Import','Budgets','Reminders'];const NI={Overview:'📊',Transactions:'🧾',Accounts:'🏦',Import:'⚡',Budgets:'🎯',Reminders:'⏰'},CI={Food:'🍔',Transport:'🚕',Rent:'🏠',Bills:'💡',Shopping:'🛍️',Health:'💊',Entertainment:'🎬',Savings:'🏦',Other:'📦',Income:'💵'};
const pm=(m,d=-1)=>{const[y,mo]=m.split('-').map(Number),x=new Date(y,mo-1+d,1);return `${x.getFullYear()}-${pad(x.getMonth()+1)}`};

const col=c=>CATS[c]||'#8b968f';
function guess(m){const l=m.toLowerCase(),k=key(m);if(S.rules[k])return[S.rules[k],95];for(const c in KW)if(KW[c].some(w=>l.includes(w)))return[c,85];return['Other',30]}
function add(t){if(S.tx.some(x=>x.date==t.date&&x.amt==t.amt&&x.type==t.type&&x.m.toLowerCase()==t.m.toLowerCase()))return false;
 let c,cf;if(t.type=='in'){c='Income';cf=100}else if(t.cat){c=t.cat;cf=100}else[c,cf]=guess(t.m);
 S.tx.push({id:Math.random().toString(36).slice(2,9),date:t.date,amt:+t.amt,type:t.type,m:t.m,cat:c,conf:cf,acc:t.acc||((S.acc.find(a=>t.l4&&a.last4==t.l4)||{}).id)||S.ia||''});return true}
const mt=m=>S.tx.filter(t=>t.date.startsWith(m));
const sum=(a,ty)=>a.filter(t=>t.type==ty).reduce((s,t)=>s+t.amt,0);
function byCat(m){const o={};mt(m).filter(t=>t.type=='out').forEach(t=>o[t.cat]=(o[t.cat]||0)+t.amt);return o}
const bf=c=>(S.bud[c]||0)+(S.roll&&S.bud[c]?Math.max(0,S.bud[c]-(byCat(pm(M))[c]||0)):0);
function applyRec(){S.rec.forEach(r=>{const d=`${CUR}-${pad(Math.min(r.day,28))}`;if(d<=TODAY)add({date:d,amt:r.amt,type:r.type,m:r.m,acc:r.acc})});save()}
function pdate(s){let m=s.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return`${m[1]}-${pad(m[2])}-${pad(m[3])}`;m=s.match(/(\d{1,2})[-\/](\d{1,2})[-\/](\d{2,4})/);if(m){const y=m[3].length==2?'20'+m[3]:m[3];return`${y}-${pad(m[2])}-${pad(m[1])}`}return TODAY}
function sms(line){const a=line.match(/(?:rs\.?|inr|₹)\s*([\d,]+(?:\.\d+)?)/i);if(!a)return null;
 const type=/credited|received|deposited|refund/i.test(line)?'in':'out';
 let m=line.match(/(?:\bat|\bto|towards|from|info[:\-])\s+([A-Za-z][A-Za-z0-9 &._-]{1,28})/i);
 m=m?m[1].split(/\s+(?:on|via|ref|upi|using|with|avl|bal|a\/c)\b/i)[0].trim():'Unknown';
 return{date:pdate(line),amt:parseFloat(a[1].replace(/,/g,'')),type,m,l4:(line.match(/(?:a\/c|acct|account|card)[^\d]{0,15}(\d{4})\b/i)||[])[1]}}
function doSms(){const r=$('sms').value.split(/\n+/).map(s=>s.trim()).filter(Boolean);let ok=0,dup=0,bad=0;
 r.forEach(l=>{const t=sms(l);if(!t)bad++;else add(t)?ok++:dup++});done(ok,dup,bad,'smsr');$('sms').value=''}
function doCsv(txt){const rows=txt.split(/\r?\n/).filter(Boolean);let ok=0,dup=0,bad=0;
 rows.forEach((l,i)=>{const p=l.split(',').map(s=>s.trim().replace(/^"|"$/g,''));if(p.length<3||(i==0&&isNaN(parseFloat(p[2]))))return;
  const a=parseFloat(p[2].replace(/[₹,]/g,''));if(isNaN(a)){bad++;return}
  const ty=a<0?'out':/^(in|cr|credit|income)/i.test(p[3]||'')?'in':'out';add({date:pdate(p[0]),m:p[1]||'Unknown',amt:Math.abs(a),type:ty})?ok++:dup++});done(ok,dup,bad,'csvr')}
function done(ok,dup,bad,id){save();M=CUR;$(id).textContent=`Added ${ok}. Skipped ${dup} duplicate${dup==1?'':'s'}. Could not read ${bad}.`;head()}
function recat(id,c){const t=S.tx.find(x=>x.id==id);t.cat=c;t.conf=100;const k=key(t.m);if(k){S.rules[k]=c;S.tx.forEach(x=>{if(x.type=='out'&&x.conf<100&&key(x.m)==k){x.cat=c;x.conf=95}})}save();rows()}
function del(id){S.tx=S.tx.filter(x=>x.id!=id);save();rows()}
function addManual(){const a=+$('ma').value,m=$('mm').value.trim(),d=$('md').value||TODAY;if(!a||a<=0||!m){$('mr').textContent='Enter an amount above zero and a merchant.';return}
 add({date:d,amt:a,type:$('mt').value,m,cat:$('mc').value||''});save();M=d.slice(0,7);$('mr').textContent='Transaction saved.';head()}
function addRec(){const a=+$('ra').value,m=$('rm').value.trim(),d=+$('rd').value;if(!a||!m||d<1||d>31){$('rr').textContent='Enter a name, amount and day (1 to 31).';return}
 S.rec.push({id:Date.now(),m,amt:a,type:$('rt').value,day:d,acc:S.ia});applyRec();render()}
function delRec(id){S.rec=S.rec.filter(r=>r.id!=id);save();render()}
function setBud(c,v){S.bud[c]=+v||0;save();render()}
function suggest(){const hist=[1,2,3].map(i=>byCat(pm(M,-i)));let any=hist.some(h=>Object.keys(h).length);
 if(any){Object.keys(CATS).forEach(c=>{const v=hist.reduce((s,h)=>s+(h[c]||0),0)/3;S.bud[c]=v?Math.ceil(v*1.05/100)*100:0})}
 else{const inc=sum(mt(M),'in');if(!inc){alert('Add income or past spending first so budgets can be suggested.');return}
  const n=inc*.5,w=inc*.3,s=inc*.2,r=x=>Math.round(x/100)*100;Object.assign(S.bud,{Rent:r(n*.4),Food:r(n*.25),Bills:r(n*.15),Transport:r(n*.1),Health:r(n*.1),Shopping:r(w*.5),Entertainment:r(w*.5),Savings:r(s)})}
 save();render()}
const GUEST='guest@smartspend.local',isGuest=()=>K=='ss_data_'+GUEST,rn=(a,b)=>Math.round(a+Math.random()*(b-a));
function seedGuest(){S=S0();S.acc=[{id:'g1',bank:'HDFC Bank',type:'Savings',name:'Salary account',last4:'4821',ob:rn(20,60)*1000},{id:'g2',bank:'ICICI Bank',type:'Credit card',name:'ICICI card',last4:'1190',ob:-rn(2,9)*1000}];S.ia='g1';
 S.bills=[{id:1,t:'Credit card bill',amt:rn(3,12)*1000,date:lz(new Date(Date.now()+rn(1,6)*864e5)).slice(0,10),rep:'monthly',before:3,nf:''}];sample()}
function sample(){if(!isGuest())return;const L=[[1,'Salary',85000,'in'],[3,'House Rent',22000,'out'],[2,'Swiggy',480,'out'],[6,'Zomato',620,'out'],[11,'Swiggy',540,'out'],[18,'BigBasket',1800,'out'],[4,'Uber',320,'out'],[13,'Ola',410,'out'],[8,'Jio Recharge',599,'out'],[9,'Netflix',649,'out'],[10,'BESCOM Electricity',1450,'out'],[15,'Amazon',2400,'out'],[16,'Apollo Pharmacy',850,'out'],[20,'BookMyShow',700,'out'],[5,'Groww SIP',5000,'out']];
 for(let i=0;i<4;i++){const m=pm(CUR,-i);L.forEach(([d,n,a,t],j)=>{const dt=`${m}-${pad(d)}`;if(dt<=TODAY)add({date:dt,m:n,amt:t=='in'?Math.round(a*(.8+Math.random()*.35)/500)*500:a>=20000?a:a<3000?Math.round(a*(.6+Math.random()*.9)/10)*10:Math.round(a*(.9+Math.random()*.2)/50)*50,type:t})})}
 add({date:TODAY,m:'Unknown Shop 4821',amt:760,type:'out'});S.bud={Food:5000,Transport:1500,Rent:22000,Bills:3000,Shopping:2500,Health:1200,Entertainment:1500,Savings:5000};save();M=CUR;head()}

function alerts(){const out=[],by=byCat(M),dim=new Date(+M.slice(0,4),+M.slice(5),0).getDate(),dn=M==CUR?now.getDate():dim;
 Object.keys(CATS).forEach(c=>{const b=bf(c);if(!b)return;const s=by[c]||0,p=s/b,proj=s/dn*dim;
  if(p>=1)out.push(['d',`${c}: budget crossed. Over by ${fmt(s-b)}.`]);else if(p>=.8)out.push(['w',`${c}: ${Math.round(p*100)}% used. ${fmt(b-s)} left.`]);else if(p>=.5)out.push(['i',`${c}: halfway through the budget (${Math.round(p*100)}%).`]);

 Object.values(seen).filter(x=>x.ms.size>=3&&!S.rec.some(r=>key(r.m)==key(x.m))).slice(0,3).forEach(x=>out.push(['i',`Possible subscription: ${esc(x.m)} at ${fmt(x.a)} every month. Add it under Recurring to track it automatically.`]));

 if(M==CUR){S.bw=S.bw||{};for(const c in CATS){const b=bf(c);if(b&&(byCat(CUR)[c]||0)>=b&&!S.bw[CUR+c]){S.bw[CUR+c]=1;save();ring({t:`${c} budget crossed (${fmt(byCat(CUR)[c])} of ${fmt(b)})`});return}}}}
setInterval(chk,5000);
function addAl(){const t=$('rtl').value.trim(),d=$('rdt').value;if(!t||!d){$('alr').textContent='Enter a title and a date and time.';return}if(new Date(d)<=new Date()){$('alr').textContent='Pick a time in the future.';return}
 S.alarms.push({id:Date.now(),t,due:d,rep:$('rrp').value,on:true});save();render()}
function togAl(id,v){const a=S.alarms.find(x=>x.id==id);a.on=v;if(v&&new Date(a.due)<=new Date()&&a.rep=='none'){a.due=lz(new Date(Date.now()+60e3))}save();render()}
function delAl(id){S.alarms=S.alarms.filter(x=>x.id!=id);save();render()}
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.tagName=='INPUT'&&e.target.closest('#auth'))auth()});
{const U=lsg('ss_users')||{},e=lsg('ss_session');if(e&&U[e])login(e);else authUI()}
</script></body></html>
